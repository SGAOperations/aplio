version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
