# Neon Preview Branch — per-PR isolated database with auto-migration
#
# Required secrets (GitHub → Settings → Secrets and variables → Actions):
#   NEON_API_KEY            — Neon API key with branch create/delete permissions
#   NEON_PROJECT_ID         — Neon project ID (find in Neon console → Settings)
#   NEON_PARENT_BRANCH_ID   — Neon branch ID of the *dev* branch (Neon console →
#                             Branches → dev → Settings). REQUIRED — preview branches
#                             must fork from dev (not prod). The check_neon step fails
#                             loudly if this secret is absent.
#   VERCEL_TOKEN        — Vercel personal access token (optional; skip var-wiring if absent)
#   VERCEL_ORG_ID       — Vercel team/org ID (optional)
#   VERCEL_PROJECT_ID   — Vercel project ID (optional)

name: Neon Preview Branch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

# Cancel in-progress runs for the same PR so rapid pushes don't race on the
# same Neon branch (create-vs-migrate overlap).
concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── upsert ─────────────────────────────────────────────────────────────────
  # Runs on open / synchronize / reopen.
  # Creates (or reuses) a Neon branch, applies pending migrations, and redeploys the
  # preview when the branch-scoped DATABASE_URL changed (Vercel bakes env vars in at
  # build creation, so a mid-build write needs a rebuild to take effect).
  upsert:
    name: Create branch & migrate
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        # npm ci is the correct CI form — lockfile-faithful, no resolution surprises.
        # Existing workflows use npm install; this workflow intentionally uses npm ci.
        run: npm ci

      - name: Generate Prisma client
        # Guards against config drift; migrate deploy doesn't strictly need it but
        # aligns with the other workflows and catches schema/config issues early.
        run: npm run prisma:generate

      - name: Check Neon secrets
        id: check_neon
        # secrets.* cannot be evaluated directly in `if:` conditions, so we probe
        # via env and write a flag to GITHUB_OUTPUT.
        # NEON_PARENT_BRANCH_ID is required — silently falling back to prod is wrong.
        env:
          HAS_KEY: ${{ secrets.NEON_API_KEY != '' }}
          HAS_PROJECT: ${{ secrets.NEON_PROJECT_ID != '' }}
          HAS_PARENT: ${{ secrets.NEON_PARENT_BRANCH_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_PROJECT" != "true" ]; then
            echo "::error::NEON_API_KEY and NEON_PROJECT_ID are required secrets. Configure them in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$HAS_PARENT" != "true" ]; then
            echo "::error::NEON_PARENT_BRANCH_ID is required. Set it to the Neon branch ID of the dev branch (Neon console → Branches → dev → Settings) so preview branches fork from dev, not prod."
            exit 1
          fi
          echo "has_neon=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse Neon branch
        id: create_branch
        if: steps.check_neon.outputs.has_neon == 'true'
        # @v6 — current major; outputs: db_url (direct/unpooled). db_url_with_pooler is empty in v6.
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          # Stable slug: preview/<head-ref> matches the issue's naming convention.
          # The create-branch action accepts arbitrary branch names and is idempotent
          # (reuses an existing branch with the same name).
          branch_name: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
          # Required: fork from the dev branch, not prod. NEON_PARENT_BRANCH_ID must be
          # set to the Neon branch ID of dev — enforced by the check_neon step above.
          parent_branch: ${{ secrets.NEON_PARENT_BRANCH_ID }}

      # Mask the URL so it never appears in subsequent log lines.
      # Note: ::add-mask:: only redacts output printed *after* this step — it cannot
      # retroactively scrub log lines the create-branch action emitted during its own
      # execution. The Neon action masks internally; this step guards any downstream
      # shell steps that echo the URL.
      - name: Mask Neon connection string
        if: steps.check_neon.outputs.has_neon == 'true'
        run: |
          echo "::add-mask::${{ steps.create_branch.outputs.db_url }}"

      - name: Apply migrations
        if: steps.check_neon.outputs.has_neon == 'true'
        # Uses the direct (unpooled) URL — prisma migrate deploy requires a direct connection.
        # No continue-on-error: a migration failure MUST turn the PR check red (AC).
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}

      # ── Vercel env-var wiring (resilient — skipped if secrets absent) ──────

      - name: Check Vercel secrets
        id: check_vercel
        # secrets.* cannot be evaluated directly in `if:` conditions, so we probe
        # via env and write a flag to GITHUB_OUTPUT.
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ORG" = "true" ] && [ "$HAS_PROJECT" = "true" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets not configured; skipping preview env var update."
          fi

      - name: Set Vercel preview DATABASE_URL
        id: set_env
        # Uses the direct URL from db_url — v6 does not populate db_url_with_pooler.
        # The Prisma datasource has no directUrl split, so the direct endpoint is fine.
        # Endpoint: POST /v10/projects/{id}/env (Vercel REST API)
        # Scoped to target=preview + gitBranch=<head_ref> so only this PR's preview
        # deployment sees the branch DB; production is never touched.
        if: steps.check_neon.outputs.has_neon == 'true' && steps.check_vercel.outputs.has_vercel == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          BRANCH_URL: ${{ steps.create_branch.outputs.db_url }}
          GIT_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$BRANCH_URL" ]; then
            echo "::error::db_url output from create-branch-action is empty; cannot set Vercel DATABASE_URL."
            exit 1
          fi

          # Look up any existing branch-scoped DATABASE_URL to avoid duplicates.
          # Also capture updatedAt *before* writing: the redeploy step compares it to
          # the current deployment's build time to decide whether that build already
          # had this value. Comparing the values themselves is not an option — Vercel
          # does not return a decrypted value for an encrypted var, so a value check
          # never matches and would redeploy on every push.
          # jq @uri performs RFC-3986 percent-encoding without requiring Python.
          EXISTING_JSON=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&gitBranch=$(printf '%s' "$GIT_BRANCH" | jq -sRr @uri)" \
            || true)

          EXISTING_ID=$(printf '%s' "$EXISTING_JSON" \
            | jq -r '.envs[]? | select(.key == "DATABASE_URL" and .gitBranch == env.GIT_BRANCH) | .id' \
            || true)
          EXISTING_UPDATED_AT=$(printf '%s' "$EXISTING_JSON" \
            | jq -r '[.envs[]? | select(.key == "DATABASE_URL" and .gitBranch == env.GIT_BRANCH) | .updatedAt] | first // empty' \
            || true)

          if [ -n "$EXISTING_ID" ] && [ -n "$EXISTING_UPDATED_AT" ]; then
            echo "Existing branch-scoped DATABASE_URL last updated at $EXISTING_UPDATED_AT."
            echo "env_updated_at_before=$EXISTING_UPDATED_AT" >> "$GITHUB_OUTPUT"
          else
            echo "No existing branch-scoped DATABASE_URL for $GIT_BRANCH; a redeploy will be required."
            echo "env_updated_at_before=absent" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            # Patch the existing record in-place.
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env/$EXISTING_ID?teamId=$VERCEL_ORG_ID" \
              -d "{\"value\":\"$BRANCH_URL\"}")
          else
            # Create a new branch-scoped preview env var.
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
              -d "{\"key\":\"DATABASE_URL\",\"value\":\"$BRANCH_URL\",\"type\":\"encrypted\",\"target\":[\"preview\"],\"gitBranch\":\"$GIT_BRANCH\"}")
          fi

          # A non-2xx from a configured Vercel integration is a real error — fail the job.
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Vercel API returned HTTP $HTTP_STATUS for branch $GIT_BRANCH; failing job."
            exit 1
          fi

      - name: Redeploy preview against the branch database
        # Vercel resolves env vars when a build is created and bakes them into that
        # deployment, and it never waits on Actions. So the deployment the git
        # integration started before this job ran cannot see the DATABASE_URL written
        # above — it silently uses the generic preview value (the dev DB) until
        # something rebuilds it. Redeploy so the value actually takes effect.
        #
        # Skipped once the live deployment was built after the variable was last set —
        # in practice every push after the first, so no duplicate builds in steady
        # state. Timestamps are used rather than a value comparison because Vercel does
        # not hand back a decrypted value to compare against.
        #
        # This creates a Vercel deployment, not a git push, so it cannot re-trigger
        # this workflow.
        if: steps.check_neon.outputs.has_neon == 'true' && steps.check_vercel.outputs.has_vercel == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_BRANCH: ${{ github.head_ref }}
          ENV_UPDATED_AT_BEFORE: ${{ steps.set_env.outputs.env_updated_at_before }}
        run: |
          # Select by githubCommitRef rather than github.sha: on pull_request events
          # github.sha is the synthetic merge commit, while Vercel deploys the branch
          # head. Newest deployment for the branch is the one serving the preview.
          DEPLOYMENT=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=preview&limit=100" \
            | jq -r --arg ref "$GIT_BRANCH" \
              '[.deployments[]? | select(.meta.githubCommitRef == $ref)] | sort_by(.created) | last | "\(.uid // "") \(.created // "")"' \
            || true)

          DEPLOYMENT_ID=${DEPLOYMENT%% *}
          DEPLOYMENT_CREATED=${DEPLOYMENT##* }

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::No Vercel preview deployment found for branch $GIT_BRANCH; cannot redeploy. The preview would keep using the wrong database."
            exit 1
          fi

          # Both are epoch milliseconds. A deployment created after the variable was
          # last written already resolved it at build time and needs nothing. The
          # numeric guards also cover "absent" and any missing field, which fall
          # through to a redeploy rather than aborting on an integer comparison.
          NUMERIC='^[0-9]+$'
          if [[ "$ENV_UPDATED_AT_BEFORE" =~ $NUMERIC ]] && [[ "$DEPLOYMENT_CREATED" =~ $NUMERIC ]] \
            && [ "$DEPLOYMENT_CREATED" -gt "$ENV_UPDATED_AT_BEFORE" ]; then
            echo "Deployment $DEPLOYMENT_ID was built at $DEPLOYMENT_CREATED, after the DATABASE_URL was set at $ENV_UPDATED_AT_BEFORE; it already has the branch database."
            exit 0
          fi

          # v13 create-deployment requires `name`; read it rather than adding a secret.
          PROJECT_NAME=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.name // empty' \
            || true)

          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Could not resolve the Vercel project name for $VERCEL_PROJECT_ID; cannot redeploy."
            exit 1
          fi

          # deploymentId redeploys that deployment, inheriting its source and settings
          # while re-resolving env vars. forceNew=1 bypasses dedupe, which would
          # otherwise hand back the existing build unchanged.
          # `target` is deliberately omitted: v13 rejects "preview" (it accepts only
          # production/staging/a custom environment), and preview is the default the
          # redeploy inherits anyway.
          HTTP_STATUS=$(curl -s -o /tmp/redeploy.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -d "{\"name\":\"$PROJECT_NAME\",\"deploymentId\":\"$DEPLOYMENT_ID\"}")

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Vercel redeploy returned HTTP $HTTP_STATUS for branch $GIT_BRANCH; failing job."
            jq -r '.error.message // "no error message in response"' /tmp/redeploy.json
            exit 1
          fi

          echo "Redeployed $DEPLOYMENT_ID for $GIT_BRANCH; the new build picks up the branch database."
          echo "Build outcome is reported by Vercel's own PR check."

  # ── cleanup ────────────────────────────────────────────────────────────────
  # Runs on PR close (merged or abandoned).
  # Deletes the Neon branch and removes the branch-scoped Vercel env var.
  cleanup:
    name: Delete branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete Neon branch
        id: delete_branch
        # @v3 — current major; tolerant if the branch is already gone (idempotent).
        # continue-on-error is acceptable here: a missing branch on cleanup is benign.
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Log Neon branch teardown result
        # Surfaces the outcome regardless of continue-on-error so teardown is
        # auditable in the run log. A failed delete is non-fatal (stale branches
        # can be cleaned up manually), but it should be visible.
        run: |
          if [ "${{ steps.delete_branch.outcome }}" = "success" ]; then
            echo "Neon branch preview/${{ github.head_ref }} deleted successfully."
          else
            echo "::warning::Neon branch preview/${{ github.head_ref }} delete failed or was already absent (outcome: ${{ steps.delete_branch.outcome }})."
          fi

      # ── Vercel cleanup (resilient — skipped if secrets absent) ─────────────

      - name: Check Vercel secrets
        id: check_vercel
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ORG" = "true" ] && [ "$HAS_PROJECT" = "true" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets not configured; skipping preview env var cleanup."
          fi

      - name: Remove Vercel preview DATABASE_URL
        # Deletes the branch-scoped env var created during upsert.
        # Skips silently if not found — cleanup is best-effort.
        if: steps.check_vercel.outputs.has_vercel == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GIT_BRANCH: ${{ github.head_ref }}
        run: |
          # jq @uri performs RFC-3986 percent-encoding without requiring Python.
          EXISTING_ID=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&gitBranch=$(printf '%s' "$GIT_BRANCH" | jq -sRr @uri)" \
            | jq -r '.envs[] | select(.key == "DATABASE_URL" and .gitBranch == env.GIT_BRANCH) | .id' \
            || true)

          if [ -z "$EXISTING_ID" ] || [ "$EXISTING_ID" = "null" ]; then
            echo "No branch-scoped DATABASE_URL found for branch $GIT_BRANCH; nothing to clean up."
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env/$EXISTING_ID?teamId=$VERCEL_ORG_ID")

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Vercel DELETE returned HTTP $HTTP_STATUS for branch $GIT_BRANCH; failing job."
            exit 1
          fi
          echo "Removed branch-scoped DATABASE_URL for Vercel preview branch $GIT_BRANCH."
