# Gates `dev` PRs on `approved`, only when labeled `claude` — others skip.
# NEVER narrow the trigger or rename the job: no check run = pending forever.
# `branches: [dev]` is safe only because the required-check registration is
# `dev`-scoped too — NEVER add this to the `main/dev` ruleset (id 15248252);
# dev → main release PRs carry no pipeline labels.

name: Approval Check

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  run-approval-check:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'claude')
    timeout-minutes: 5
    steps:
      - name: Check pipeline labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # One label per line, in the ticket's order. `blocked` is an
          # issue-stage label carried here as defence-in-depth.
          BLOCKING_LABELS="needs revision
          needs human
          reviewing
          revising
          refreshing
          blocked"

          if ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '.labels[].name' > "$RUNNER_TEMP/labels.txt"; then
            echo "::error::Could not read labels for PR #$PR."
            exit 1
          fi

          echo "Labels on PR #$PR:"
          cat "$RUNNER_TEMP/labels.txt"

          FAILED=0
          FOUND_BLOCKING=""

          while IFS= read -r LABEL; do
            [ -z "$LABEL" ] && continue
            if grep -Fxq "$LABEL" "$RUNNER_TEMP/labels.txt"; then
              FOUND_BLOCKING="$FOUND_BLOCKING$LABEL, "
            fi
          done <<EOF
          $BLOCKING_LABELS
          EOF

          if ! grep -Fxq "approved" "$RUNNER_TEMP/labels.txt"; then
            echo "::error::Missing the 'approved' label. This PR carries 'claude', so it is a pipeline PR and merges only once review-agent applies 'approved'. If it is not a pipeline PR, remove the 'claude' label and this check will skip."
            FAILED=1
          fi

          if [ -n "$FOUND_BLOCKING" ]; then
            echo "::error::Blocking pipeline label(s): ${FOUND_BLOCKING%, }. The PR is mid-pipeline; wait for it to reach 'approved'."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "'approved' present, no blocking pipeline labels — merge gate satisfied."
