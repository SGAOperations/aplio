name: Build Check
on:
  pull_request:
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: aplio_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://admin:admin@localhost:5432/aplio_build
      BETTER_AUTH_SECRET: build-check-dummy-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations
        run: npm run prisma:migrate:deploy
      - name: Build
        run: npm run build
