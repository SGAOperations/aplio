# Migrate DB — deploy pending migrations to long-lived environments
#
# Required secrets (GitHub → Settings → Secrets and variables → Actions):
#   PRODUCTION_DATABASE_URL — direct/unpooled Postgres connection string for the
#                             production database; used on pushes to `main`.
#   DEV_DATABASE_URL        — direct/unpooled Postgres connection string for the
#                             dev database; used on pushes to `dev`.
#
# Both secrets MUST use a direct (unpooled) connection — `prisma migrate deploy`
# requires a direct connection; a pooled/PgBouncer endpoint will cause the
# migration step to fail. The selected secret is assigned to DATABASE_URL at
# runtime by branch (push) or by the `target` input (workflow_dispatch).
#
# `workflow_dispatch` lets `target: dev` be exercised on demand — e.g. to
# validate this workflow itself before it ever touches production — without
# waiting for a migration to land on the `dev` branch.
#
# Failure model: a failed migration fails this workflow loudly (no continue-on-error).
#
# Rollback runbook (no automated rollback):
#   1. Stop — do not re-run this workflow against the same target.
#   2. Restore the target database from its most recent Neon point-in-time
#      branch (Neon console → Branches → Restore) to just before the apply.
#   3. Revert the migration commit on the affected branch (`git revert`), then
#      re-run this workflow so `prisma_migrations` and the schema agree again.

name: Migrate DB

on:
  push:
    branches: [main, dev]
    paths:
      - 'prisma/migrations/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to migrate'
        required: true
        type: choice
        options: [dev, production]

concurrency:
  group: migrate-db-${{ github.ref }}
  cancel-in-progress: false # migrations must not be interrupted mid-apply

permissions:
  contents: read

jobs:
  migrate:
    name: Deploy migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (inputs.target == 'production' || github.ref_name == 'main') && 'production' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select database URL
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          TARGET: ${{ inputs.target || github.ref_name }}
        run: |
          case "$TARGET" in
            main|production)
              SELECTED_SECRET="$PRODUCTION_DATABASE_URL"
              SECRET_NAME="PRODUCTION_DATABASE_URL"
              ;;
            dev)
              SELECTED_SECRET="$DEV_DATABASE_URL"
              SECRET_NAME="DEV_DATABASE_URL"
              ;;
            *)
              echo "::error::Unrecognized target '$TARGET'. Update on.push.branches, workflow_dispatch.inputs.target, and the case statement together."
              exit 1
              ;;
          esac

          if [ -z "$SELECTED_SECRET" ]; then
            echo "::error::Required secret $SECRET_NAME for target $TARGET is not configured. Add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "DATABASE_URL=$SELECTED_SECRET" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Preflight — migration status
        run: |
          set -uo pipefail
          set +e
          npm run prisma:migrate:status > "$RUNNER_TEMP/status.txt" 2>&1
          STATUS_EXIT=$?
          set -e
          {
            echo "### Migration status ($TARGET)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/status.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/status.txt"
          # "Drift detected" means the schema diverged outside of tracked
          # migrations — never safe to apply on top of. Untracked/pending
          # migrations alone are the expected pre-apply state and pass through.
          # Any other non-zero exit (bad DATABASE_URL, auth failure, corrupted
          # migration history, transient network error) must fail closed rather
          # than fall through to "no drift string found, assume safe".
          if grep -qi 'drift detected' "$RUNNER_TEMP/status.txt"; then
            echo "::error::Migration drift detected against $TARGET — refusing to apply. See the step summary."
            exit 1
          elif [ "$STATUS_EXIT" -ne 0 ]; then
            if grep -qiE 'have not yet been applied' "$RUNNER_TEMP/status.txt"; then
              echo "Pending migrations detected against $TARGET — expected pre-apply state, continuing."
            else
              echo "::error::prisma migrate status failed unexpectedly (exit $STATUS_EXIT) against $TARGET — refusing to apply. See the step summary."
              exit 1
            fi
          fi
        env:
          TARGET: ${{ inputs.target || github.ref_name }}

      - name: Apply migrations
        run: npm run prisma:migrate:deploy
